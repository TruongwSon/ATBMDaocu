<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Màn hình đạo cụ PCCV</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: bảng điều khiển phim trường — danh sách shot bên trái, sân khấu 16:9 bên phải, chế độ quay phủ kín màn hình */
:root{--bg:#f1f4f6;--panel:#ffffff;--line:#d5dce2;--fg:#151b21;--mute:#5a6673;--accent:#0b7a6c;--accent-fg:#ffffff;--rec:#c8322b;--chip:#e4eaee;--sel:#dff1ee;
--ui:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'JetBrains Mono',ui-monospace,Consolas,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1318;--panel:#161c23;--line:#26303a;--fg:#e6ebf0;--mute:#8b97a4;--accent:#35c2ae;--accent-fg:#06211d;--rec:#ff5b52;--chip:#202933;--sel:#17332f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1318;--panel:#161c23;--line:#26303a;--fg:#e6ebf0;--mute:#8b97a4;--accent:#35c2ae;--accent-fg:#06211d;--rec:#ff5b52;--chip:#202933;--sel:#17332f;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:14px;line-height:1.5;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;gap:12px;padding-inline:16px;padding-block:12px}
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font-size:17px;font-weight:700;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--mute)}
.tabs{display:flex;gap:4px;background:var(--chip);padding:3px;border-radius:8px}
.tabs button{border:0;background:transparent;padding:5px 12px;border-radius:6px;font-weight:500;color:var(--mute)}
.tabs button.on{background:var(--panel);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.top-r{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);padding:6px 12px;border-radius:7px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.rec{background:var(--rec);border-color:var(--rec);color:#fff;font-weight:600}
.body{flex:1;min-height:0;display:flex;gap:12px}
nav{width:300px;flex:none;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px}
.grp{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);padding:10px 8px 4px;font-weight:600}
.it{display:flex;gap:8px;width:100%;text-align:left;border:0;background:transparent;padding:6px 8px;border-radius:6px;align-items:baseline}
.it:hover{background:var(--chip)}
.it.on{background:var(--sel);box-shadow:inset 3px 0 0 var(--accent)}
.it .sh{font-family:var(--mono);font-size:11px;color:var(--mute);flex:none;width:44px}
.it .tt{min-width:0}
.it .tt small{display:block;color:var(--mute);font-size:11.5px}
#main{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bar .who{min-width:0;margin-right:auto}
.bar .who b{display:block;font-weight:600}
.bar .who span{font-size:12px;color:var(--mute)}
.act{border:1px solid var(--accent);color:var(--accent);background:transparent;padding:5px 11px;border-radius:7px;font-weight:600;display:flex;gap:7px;align-items:center}
.act i{font-style:normal;font-family:var(--mono);font-size:11px;background:var(--accent);color:var(--accent-fg);border-radius:4px;padding:0 5px}
.act:hover{background:var(--sel)}
.stage{position:relative;flex:1;min-height:0;background:#000;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
#fit{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0}
#cv{position:absolute;inset:0;overflow:hidden;background:#000}
.hint{font-size:12px;color:var(--mute)}
.hint kbd{font-family:var(--mono);font-size:11px;background:var(--chip);border:1px solid var(--line);border-radius:4px;padding:0 5px}
#diy{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;align-content:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.card h3{margin:0 0 2px;font-size:15px}
.card .ref{font-size:12px;color:var(--accent);font-weight:600;margin-bottom:8px}
.card ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.card pre{margin:10px 0 0;padding:10px;background:var(--bg);border:1px solid var(--line);border-radius:7px;font:12px/1.5 var(--mono);white-space:pre-wrap;word-break:break-all}
.card .cp{margin-top:8px}
.card .warn{margin-top:10px;font-size:12.5px;color:var(--rec)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#000c;color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;z-index:30;pointer-events:none;transition:opacity .5s}
.shoot .app{padding:0}.shoot .top,.shoot nav,.shoot .bar,.shoot #diy{display:none!important}
.shoot .body{display:block}.shoot #main{position:fixed;inset:0;z-index:20;background:#000}
.shoot .stage{position:absolute;inset:0;border:0;border-radius:0}
@media (max-width:820px){body{overflow:auto}.app{height:auto;min-height:100%}.body{flex-direction:column}nav{width:auto;max-height:240px}.stage{flex:none;aspect-ratio:16/9;width:100%}}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}

/* ===== Mô phỏng màn hình (không theo theme, vì là đạo cụ trên màn hình giả) ===== */
#cv,#cv *{box-sizing:border-box}
#cv button{cursor:pointer}
.scr{position:absolute;inset:0;font-family:'Segoe UI',Arial,sans-serif;color:#202124;font-size:15px}
.br{position:absolute;inset:0;display:flex;flex-direction:column;background:#fff;color:#202124;font:15px 'Segoe UI',Arial,sans-serif}
.br-tabs{height:38px;background:#dee1e6;display:flex;align-items:flex-end;padding:0 10px;flex:none}
.br-tab{background:#fff;padding:7px 18px;border-radius:9px 9px 0 0;font-size:13px;max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.br-bar{height:42px;background:#fff;border-bottom:1px solid #dadce0;display:flex;align-items:center;gap:10px;padding:0 12px;flex:none;color:#5f6368}
.br-url{flex:1;background:#f1f3f4;border-radius:18px;padding:6px 16px;font-size:14px;color:#202124}
.br-page{flex:1;position:relative;overflow:hidden}
.red{color:#d93025}
.pop{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#0006;z-index:5}
.mono{font-family:'JetBrains Mono',Consolas,monospace}
/* ci */
.ci{display:flex;height:100%;background:#f6f8fa}.ci aside{width:200px;background:#24292f;color:#d0d7de;padding:18px;display:flex;flex-direction:column;gap:12px}.ci aside b{color:#fff;font-size:18px;margin-bottom:8px}
.ci main{flex:1;padding:28px 40px}.ci h1{margin:2px 0 4px;font-size:26px}.ci small{color:#57606a}.ci code{background:#eaeef2;padding:1px 7px;border-radius:5px}
.ci-st{display:flex;gap:14px;margin:26px 0}.ci-st div{flex:1;background:#fff;border:1px solid #d0d7de;border-radius:8px;padding:14px 16px;font-weight:600;border-left:6px solid #1a7f37;display:flex;flex-direction:column}
.ci-st span{font-weight:400;font-size:13px;color:#57606a}.ci-st .wait{border-left-color:#bf8700}.ci-st .run{border-left-color:#0969da}.ci-st .done{border-left-color:#1a7f37}
.ci-act{display:flex;align-items:center;gap:18px;margin-bottom:22px}.ci-act button{background:#d1242f;color:#fff;border:0;font-size:22px;font-weight:700;padding:18px 38px;border-radius:10px;box-shadow:0 4px 0 #8c1822}
.ci-act button:disabled{opacity:.6}.ci-log{background:#0d1117;color:#7ee787;font:14px/1.6 'JetBrains Mono',monospace;padding:16px;border-radius:8px;height:230px;overflow:hidden;margin:0}
/* explorer */
.ex{position:absolute;inset:0;background:#fff;display:flex;flex-direction:column;font-size:14px}.ex .tt{height:32px;background:#fff;border-bottom:1px solid #e5e5e5;padding:6px 12px}
.ex .rb{height:40px;background:#f3f3f3;border-bottom:1px solid #ddd;display:flex;gap:22px;align-items:center;padding:0 16px;color:#444}
.ex .ab{display:flex;gap:10px;padding:8px 12px}.ex .ab div{border:1px solid #ccc;padding:4px 10px;flex:1}.ex .ab .s{flex:none;width:300px;color:#777}
.ex .mn{flex:1;display:flex}.ex .tr{width:230px;border-right:1px solid #eee;padding:10px 14px;color:#333;line-height:2}.ex .ct{flex:1;display:flex;justify-content:center;padding-top:150px;color:#666;font-size:17px}
.ex .sb{height:26px;border-top:1px solid #eee;padding:3px 12px;color:#555;font-size:13px}
/* test env */
.tv{height:100%;background:#f4f6f8}.tv .ban{background:#c62828;color:#fff;text-align:center;font-weight:700;letter-spacing:.08em;padding:9px;font-size:17px}
.tv .hd{background:#1d3557;color:#fff;padding:14px 32px;display:flex;justify-content:space-between}.tv .cn{padding:26px 40px}
.tv .empty{background:#fff8e1;border:1px solid #f0c36d;padding:14px 18px;border-radius:8px;font-weight:600;color:#7a5200}
.tv textarea{width:100%;height:210px;margin-top:18px;border:1px solid #bbb;border-radius:6px;font:13px/1.5 'JetBrains Mono',monospace;padding:10px;resize:none}
.tv .imp{margin-top:14px;display:flex;gap:16px;align-items:center}.tv .imp button{background:#1d3557;color:#fff;border:0;padding:11px 22px;border-radius:7px;font-weight:600;font-size:15px}
.pbar{height:24px;background:#dde3ea;border-radius:12px;overflow:hidden;margin-top:14px}.pbar div{height:100%;width:0;background:#2e7d32;transition:width .2s}
/* drift desktop */
.dk{position:absolute;inset:0;background:radial-gradient(circle at 70% 30%,#3a7bd5,#0b2a5b 70%);overflow:hidden}.dk .tb{position:absolute;left:0;right:0;bottom:0;height:46px;background:#1b1f2acc;display:flex;align-items:center;padding:0 12px;gap:10px;color:#fff;font-size:13px}
.dk .tb .ic{width:26px;height:26px;border-radius:5px;background:#ffffff33}.dk.w11 .tb{justify-content:center}.dk .tb .cl{position:absolute;right:16px;text-align:right;line-height:1.2}
.dk .ico{position:absolute;color:#fff;font-size:12px;text-align:center;width:70px}.dk .ico i{display:block;width:40px;height:40px;margin:0 auto 4px;background:#ffffff40;border-radius:6px}
.dw{width:640px;background:#fffbe6;border:3px solid #f2b705;border-radius:8px;box-shadow:0 20px 60px #000a;overflow:hidden}.dw h2{margin:0;background:#f2b705;color:#3b2d00;padding:12px 20px;font-size:20px}
.dw p{padding:20px 24px 8px;margin:0;font-size:17px;line-height:1.5}.dw .bt{display:flex;gap:14px;padding:12px 24px 22px}.dw .bt button{flex:1;padding:13px;font-size:15px;border-radius:6px;border:1px solid #8a6d00;background:#fff;font-weight:600}.dw .bt .p{background:#1a73e8;color:#fff;border-color:#1a73e8}
.dw .bt small{display:block;font-weight:400;opacity:.7}
/* mooc */
.mo{height:100%;background:#f7f8fb;display:flex;flex-direction:column}.mo .nv{background:#fff;border-bottom:1px solid #e2e5ec;padding:12px 40px;display:flex;gap:28px;align-items:center}.mo .nv b{color:#2a4bd7;font-size:20px;margin-right:auto}
.mo .hero{background:linear-gradient(90deg,#2a4bd7,#6d3fd1);color:#fff;padding:26px 40px}.mo .hero h1{margin:0 0 4px;font-size:30px}
.mo .gr{display:grid;grid-template-columns:1fr 520px;gap:26px;padding:24px 40px}.mo .bx{background:#fff;border:1px solid #e2e5ec;border-radius:10px;padding:16px 20px}
.mo h3{margin:0 0 10px}.mo table{width:100%;border-collapse:collapse}.mo td,.mo th{padding:7px 8px;border-bottom:1px solid #eef0f4;text-align:left;font-size:14px}.mo .cr{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid #eef0f4}
/* tickets */
.tk{height:100%;background:#fff;display:flex;flex-direction:column}.tk .h{padding:14px 28px;background:#0747a6;color:#fff;display:flex;justify-content:space-between;align-items:center}
.tk .tl{padding:8px 28px;background:#f4f5f7;border-bottom:1px solid #dfe1e6;display:flex;gap:20px;align-items:center;font-weight:600}.tk .ls{flex:1;overflow:hidden}
.tk .r{display:flex;gap:14px;padding:3.5px 28px;border-bottom:1px solid #f0f1f3;font-size:13.5px;align-items:center}.tk .r.s{background:#e9f2ff}.tk .r b{width:68px;color:#0747a6;font-weight:600}.tk .r span:nth-child(3){flex:1}
.tk .r em{font-style:normal;background:#dfe1e6;border-radius:4px;padding:0 8px;font-size:12px}.tk .ft{padding:12px 28px;border-top:1px solid #dfe1e6;display:flex;gap:18px;align-items:center;background:#fafbfc}
.tk .ft button{background:#d1242f;color:#fff;border:0;padding:12px 24px;font-weight:700;font-size:15px;border-radius:6px;letter-spacing:.02em}.tk .ft button:disabled{background:#c8ccd3}
.tk .mdl{width:560px;background:#fff;border-radius:10px;padding:26px;box-shadow:0 20px 60px #000a}
/* servers */
.sv{height:100%;background:#1e2127;color:#e6e6e6;display:flex;flex-direction:column}.sv .h{background:#0f6cbd;color:#fff;padding:12px 24px;font-size:18px;font-weight:600}
.sv .tb{padding:14px 24px;display:flex;gap:18px;align-items:center;border-bottom:1px solid #333}.sv .tb button{background:#d1242f;color:#fff;border:0;padding:12px 20px;font-weight:700;border-radius:6px;font-size:15px}.sv .tb .sa{background:#33383f;color:#fff;font-weight:500}
.sv .gd{flex:1;padding:22px 24px;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(2,1fr);gap:16px}
.sv .c{background:#2b3038;border:2px solid #3b424b;border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:5px}.sv .c b{display:flex;gap:10px;align-items:center;font-size:17px}.sv .c small{color:#9aa4af}
.sv .d{width:16px;height:16px;border-radius:50%;background:#2ecc71;box-shadow:0 0 10px #2ecc71}.sv .st{margin-top:auto;font-weight:600;color:#2ecc71;font-size:13px}.sv .c.sel{border-color:#4aa3ff}
.sv .c.off{background:#6b0b14;border-color:#ff2d3d;animation:pl .6s infinite alternate}.sv .c.off .d{background:#ff2d3d;box-shadow:0 0 14px #ff2d3d}.sv .c.off .st{color:#ffb3b9}
.sv .bn{padding:10px 24px;background:#3b3000;color:#ffd24a;font-weight:600}.sv .bn.r{background:#7a0010;color:#fff;animation:pl .6s infinite alternate}
@keyframes pl{from{filter:brightness(.8)}to{filter:brightness(1.4)}}
/* remote */
.rm{height:100%;background:#eef1f5;padding:34px 60px}.rm .pn{background:#fff;border:1px solid #d5dbe3;border-radius:10px;padding:26px 32px;max-width:880px}.rm h2{margin:0 0 18px}
.rm .fl{display:grid;grid-template-columns:240px 1fr;gap:14px 18px;align-items:center}.rm select,.rm input{padding:10px;font-size:15px;border:1px solid #b9c1cc;border-radius:6px;background:#fff}
.rm .sm{margin-top:22px;padding:14px 18px;background:#e8f5e9;border-radius:8px;font:600 15px 'JetBrains Mono',monospace}.rm .sm.bad{background:#fdecea;color:#c62828}.rm .sv2{margin-top:18px;background:#1a73e8;color:#fff;border:0;padding:12px 28px;border-radius:7px;font-size:16px;font-weight:600}
/* reg */
.rg{height:100%;background:#fff;overflow:hidden}.rg .hd{background:linear-gradient(110deg,#10375c,#1f6f8b);color:#fff;padding:30px 60px}.rg h1{margin:0 0 6px;font-size:30px;max-width:900px}
.rg .gr{display:grid;grid-template-columns:1fr 420px;gap:34px;padding:26px 60px}.rg label{display:block;font-weight:600;margin:12px 0 4px;font-size:14px}.rg input{width:100%;padding:10px;border:1px solid #bbb;border-radius:6px}
.rg table{width:100%;border-collapse:collapse}.rg td{padding:9px 0;border-bottom:1px solid #eee}.rg .py{border:1px solid #cfd8e3;border-radius:10px;padding:18px;background:#f7fafc}
.rg .pp{display:inline-flex;align-items:center;gap:10px;border:1px solid #003087;border-radius:24px;padding:10px 24px;font-weight:800;font-size:20px;color:#003087;font-style:italic;background:#ffc439}
/* terminal */
.tm{position:absolute;inset:0;background:#0c0f14;color:#d6e2f0;font:16px/1.6 'JetBrains Mono',Consolas,monospace;padding:0}.tm .ti{background:#1b2230;padding:8px 18px;font-size:13px;color:#8fa3bd}.tm pre{margin:0;padding:18px 24px;white-space:pre-wrap;font:inherit}
.tm .cur{display:inline-block;width:10px;height:19px;background:#d6e2f0;vertical-align:-3px;animation:bk 1s steps(1) infinite}@keyframes bk{50%{opacity:0}}
.tm .g{color:#7ee787}.tm .y{color:#ffd24a}.tm .rd{color:#ff6b6b}.tm .b{color:#6cb6ff}
.wr{width:760px;background:#2b0a0a;border:3px solid #ff3b3b;border-radius:8px;box-shadow:0 0 50px #f003;overflow:hidden;font-family:'Segoe UI',Arial,sans-serif;color:#fff}.wr h2{margin:0;background:#c0151b;padding:12px 22px;font-size:19px}
.wr p{margin:0;padding:22px 26px;font:600 18px/1.5 'JetBrains Mono',monospace}.wr .bt{display:flex;gap:14px;padding:0 26px 24px}.wr button{flex:1;padding:13px;font-size:16px;font-weight:600;border-radius:6px;border:1px solid #888;background:#eee}.wr .p{background:#ff3b3b;color:#fff;border-color:#ff3b3b}
/* contract */
.ct{height:100%;background:#525659;display:flex}.ct .vw{flex:1;overflow-y:auto;padding:30px 0;scroll-behavior:auto}.ct .pg{width:760px;margin:0 auto;background:#fff;padding:60px 70px;font:15.5px/1.7 'Times New Roman',serif;color:#111;transform-origin:50% 0;transition:transform .3s}
.ct .pg h2{text-align:center;margin:0 0 4px}.ct .pg h4{margin:20px 0 4px}.ct .pg .k{background:#fff3a0}.ct .sd{width:300px;background:#323639;color:#eee;padding:24px;display:flex;flex-direction:column;gap:16px}
.ct .sd button{background:#1a73e8;color:#fff;border:0;padding:15px 12px;font-weight:700;font-size:14px;border-radius:6px;letter-spacing:.02em}.ct .stp{border:4px solid #1b8a3a;color:#1b8a3a;border-radius:10px;padding:10px 16px;font:800 20px Arial;transform:rotate(-6deg);text-align:center}
/* xp */
.xp{position:absolute;inset:0;background:#d4d0c8;font:14px Tahoma,Arial,sans-serif;display:flex;flex-direction:column;color:#000}.xp .ti{background:linear-gradient(#0a5fd8,#0c3ea5);color:#fff;font-weight:700;padding:7px 12px;font-size:15px}
.xp .mn{display:flex;gap:18px;padding:5px 12px;border-bottom:1px solid #999}.xp .tl{display:flex;gap:6px;padding:6px 12px;border-bottom:1px solid #999}.xp .tl i{width:34px;height:26px;background:#bdb9ae;border:1px outset #fff}
.xp .gd{flex:1;margin:10px;background:#fff;border:2px inset #888;overflow:hidden}.xp table{border-collapse:collapse;width:100%}.xp th{background:#d4d0c8;border:1px solid #888;padding:4px 10px;text-align:left}.xp td{border:1px solid #ccc;padding:3px 10px;font-family:'Courier New',monospace}
.xp .sb{border-top:1px solid #888;padding:4px 12px;font-size:13px}.xp .ov{position:absolute;inset:0;background:#0005;display:flex;align-items:center;justify-content:center}
.xp .al{width:640px;background:#ece9d8;border:4px solid #ffc400;outline:3px solid #d00;box-shadow:6px 6px 0 #0007}.xp .al .ti{background:#c00}.xp .al .tx{padding:20px 24px;font-size:15px;line-height:1.5}.xp .al .tx b{color:#c00}
.xp .al .bt{display:flex;gap:10px;justify-content:center;padding:6px 0 18px}.xp .al button{padding:6px 22px;font:14px Tahoma;border:2px outset #fff;background:#d4d0c8}
/* dbloss */
.db{height:100%;background:#f3f6fa;display:flex;flex-direction:column}.db .h{background:#005a9c;color:#fff;padding:14px 32px;font-size:20px;font-weight:600}.db .bd{padding:24px 40px;flex:1}

const CT='<h2>HỢP ĐỒNG DỊCH VỤ LƯU TRỮ ĐÁM MÂY</h2><div style="text-align:center">Số: 0826/HĐ-CLOUD/2026</div><h4>Điều 1. Phạm vi dịch vụ</h4><p>Bên B cung cấp dịch vụ lưu trữ video tình huống giảng dạy và phân tích khoa học cho Bên A.</p><h4>Điều 2. Dung lượng và thời hạn</h4><p>Dung lượng 20 TB, thời hạn 36 tháng kể từ ngày ký.</p><h4>Điều 3. Giá dịch vụ</h4><p>Đơn giá bằng 50% mặt bằng thị trường, thanh toán theo quý.</p><h4>Điều 4. Quyền và nghĩa vụ của Bên A</h4><p>Cung cấp dữ liệu hợp lệ, thanh toán đúng hạn, bảo quản thông tin đăng nhập.</p><h4>Điều 5. Quyền và nghĩa vụ của Bên B</h4><p>Bảo đảm dịch vụ hoạt động tối thiểu 99% thời gian trong tháng.</p><h4>Điều 6. Sao lưu</h4><p>Bên B thực hiện sao lưu theo chính sách chung của nhà cung cấp.</p><h4>Điều 7. Bảo mật thông tin</h4><p>Hai bên cam kết không tiết lộ thông tin của nhau cho bên thứ ba khi chưa có sự đồng ý.</p><h4 id="d82">Điều 8. Trách nhiệm pháp lý</h4><p>8.1. Mỗi bên chịu trách nhiệm về hành vi của mình theo quy định pháp luật.</p><p class="k" id="k82">8.2. Nhà cung cấp dịch vụ Cloud sẽ không chịu bất kỳ trách nhiệm pháp lý hoặc bồi thường tài chính nào trong trường hợp dữ liệu lưu trữ bị rò rỉ, mất mát hoặc bị bên thứ ba đánh cắp.</p><h4>Điều 9. Điều khoản chung</h4><p>Hợp đồng có hiệu lực từ ngày ký. Mọi tranh chấp ưu tiên thương lượng.</p><p style="margin-top:50px;display:flex;justify-content:space-between"><b>ĐẠI DIỆN BÊN A</b><b>ĐẠI DIỆN BÊN B</b></p><div style="height:300px"></div>';
